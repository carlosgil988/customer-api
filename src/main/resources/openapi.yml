openapi: 3.0.3

info:
  title: Customers API
  description: API for managing customers
  version: 1.0.0

paths:
  /customer/{id}:
    get:
      summary: Obtain a customer by ID
      description: Retrieves a customer by ID
      operationId: getCustomerById
      parameters:
        - name: id
          in: path
          description: Identifier of customer
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer obtained correctly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerErrorNotFound'
    delete:
      summary: Delete a customer by ID
      description: Deletes a customer by ID
      operationId: deleteCustomerById
      parameters:
        - name: id
          in: path
          description: Identifier of customer
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Customer deleted correctly.
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerErrorNotFound'

components:
  schemas:
    Customer:
      type: object
      required:
        - id
        - name
        - surname
        - email
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: "María"
        surname:
          type: string
          example: "Garcia"
        email:
          type: string
          format: email
          example: "maria.garcia@ejemplo.com"

    CustomerErrorNotFound:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Internal error.
          example: "CUSTOMER_DOES_NOT_EXIST"
        message:
          type: string
          description: Error description
          example: "Customer does not exist."
